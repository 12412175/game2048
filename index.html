<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    background: #faf8ef;
    font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;  
    justify-content: center;                                      
    overscroll-behavior: none;
    touch-action: none;
  }
  .controls {
    display: flex; gap: 10px; justify-content: center;
    padding: 16px; flex-wrap: wrap; width: 100%;
  }
  .controls button {
    background: #8f7a66; color: #f9f6f2; border: none; border-radius: 6px;
    padding: 10px 18px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .controls button:disabled { opacity: 0.4; cursor: default; }
  .controls button.active { background: #f65e3b; }             

  .board {
    position: relative;
    background: #bbada0;
    padding: 2.5vw;
    width: 100vw;
    height: 100vw;
    max-width: 600px;
    max-height: 600px;
    margin: 0 auto;                                            
  }
  .grid, .tiles {
    position: absolute;
    top: 2.5vw; left: 2.5vw; right: 2.5vw; bottom: 2.5vw;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 2.5vw;
  }
  .cell {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 6px;
  }
  .tiles { pointer-events: none; }
  .tile {
    position: relative;
    display: flex; justify-content: center; align-items: center;
    border-radius: 6px;
    font-weight: 800;
    color: #776e65;
    transition: transform 0.1s ease;
    overflow: hidden;
  }
  .tile.pop { animation: pop 0.15s ease; }
  @keyframes pop { 0%{transform:scale(0.5);} 100%{transform:scale(1);} }
  .tile img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 6px;
    display: block;
  }

  .overlay {
    position: absolute; inset: 0;
    display: none;
    justify-content: center; align-items: center;
    flex-direction: column;
    background: rgba(238, 228, 218, 0.8);
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay .msg { font-size: 40px; font-weight: 800; color: #776e65; margin-bottom: 20px; }
  .overlay .btns { display: flex; gap: 12px; }
  .overlay button {
    background: #8f7a66; color: #f9f6f2; border: none; border-radius: 6px;
    padding: 12px 22px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .overlay button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
  <div class="controls">
    <button id="restart">重新开始</button>
    <button id="save">存档</button>
    <button id="undo">撤销</button>
  </div>

  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <div class="msg" id="msg">游戏结束</div>
      <div class="btns">
        <button id="again">再来一局</button>
        <button id="loadSave">读取存档</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="auto">智能托管</button>
    <button id="rearrange">智能重排</button>
  </div>

<script>
const SIZE = 4;
const WIN_VALUE = 131072;  
let matrix = [];
let score = 0;
let over = false;
let won = false;
let maxEver = 0;
let history = [];
let savedState = null;
let savedSinceLastMove = false;
let autoTimer = null;       

const SAVE_KEY = 'game2048_save';

const colors = {
  0:'#cdc1b4',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',
  32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',
  1024:'#edc53f',2048:'#edc22e'
};
const textColors = {2:'#776e65',4:'#776e65'};

// 数值 → 图片地址 对照表（补全到 65536）
const IMG_BASE = 'https://raw.githubusercontent.com/12412175/game2048/main/images/';
const IMAGES = {
  2:     IMG_BASE + '2.png',
  4:     IMG_BASE + '4.png',
  8:     IMG_BASE + '8.png',
  16:    IMG_BASE + '16.png',
  32:    IMG_BASE + '32.png',
  64:    IMG_BASE + '64.png',
  128:   IMG_BASE + '128.png',
  256:   IMG_BASE + '256.png',
  512:   IMG_BASE + '512.png',
  1024:  IMG_BASE + '1024.png',
  2048:  IMG_BASE + '2048.png',
  4096:  IMG_BASE + '4096.png',
  8192:  IMG_BASE + '8192.png',
  16384: IMG_BASE + '16384.png',
  32768: IMG_BASE + '32768.png',
  65536: IMG_BASE + '65536.png'
};

const gridEl = document.getElementById('grid');
const tilesEl = document.getElementById('tiles');
const overlay = document.getElementById('overlay');
const msgEl = document.getElementById('msg');
const undoBtn = document.getElementById('undo');
const saveBtn = document.getElementById('save');
const loadSaveBtn = document.getElementById('loadSave');
const autoBtn = document.getElementById('auto');          

for (let i = 0; i < SIZE*SIZE; i++) {
  const c = document.createElement('div');
  c.className = 'cell';
  gridEl.appendChild(c);
}

// ---------- 存档读写 ----------
function writeSave(state) {
  savedState = state;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
  savedSinceLastMove = true;
  updateButtons();
}
function readSave() {
  if (savedState) return savedState;
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (s) { savedState = JSON.parse(s); return savedState; }
  } catch(e) {}
  return null;
}
function hasSave() { return !!readSave(); }

function makeState() {
  return {
    matrix: matrix.map(r => r.slice()),
    score: score,
    maxEver: maxEver
  };
}
function applyState(state) {
  matrix = state.matrix.map(r => r.slice());
  score = state.score;
  maxEver = state.maxEver;
  over = false; won = false;
  history = [];
  savedSinceLastMove = true;
  overlay.classList.remove('show');
  render();
}

// ---------- 游戏逻辑 ----------
function initGame() {
  stopAuto();                
  matrix = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  score = 0; over = false; won = false; maxEver = 0;
  history = [];
  savedSinceLastMove = false;
  overlay.classList.remove('show');
  createNum(); createNum();
  render();
}

function getEmpty() {
  const list = [];
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE; j++)
      if (matrix[i][j] === 0) list.push([i, j]);
  return list;
}

function currentMax() {
  let m = 0;
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE; j++)
      if (matrix[i][j] > m) m = matrix[i][j];
  return m;
}

function hasTileLE(val) {
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE; j++)
      if (matrix[i][j] !== 0 && matrix[i][j] <= val) return true;
  return false;
}

// 最小方块机制：512停2、1024停4、2048停8……
function newTileMin() {
  const m = currentMax();
  let minVal = 2;
  for (let n = 1; ; n++) {
    const threshold = 512 * Math.pow(2, n - 1);   // 512, 1024, 2048, ...
    const lowLimit  = Math.pow(2, n);             // 2, 4, 8, ...
    if (m >= threshold && !hasTileLE(lowLimit)) {
      minVal = Math.pow(2, n + 1);                // 4, 8, 16, ...
    } else {
      break;
    }
  }
  return minVal;
}

function isAdjacentToTile(x, y) {
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for (const [dx, dy] of dirs) {
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && matrix[nx][ny] !== 0)
      return true;
  }
  return false;
}

function createNum() {
  const empty = getEmpty();
  if (!empty.length) return;
  let candidates = empty.filter(([x, y]) => !isAdjacentToTile(x, y));
  if (!candidates.length) candidates = empty;
  const [x, y] = candidates[Math.floor(Math.random() * candidates.length)];
  const minVal = newTileMin();
  matrix[x][y] = Math.random() < 0.9 ? minVal : minVal * 2;
}

function slide(line) {
  let arr = line.filter(v => v !== 0);
  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i] === arr[i+1]) {
      arr[i] *= 2;
      score += arr[i];
      if (arr[i] === WIN_VALUE) won = true;   // 胜利条件 131072
      arr.splice(i+1, 1);
    }
  }
  while (arr.length < SIZE) arr.push(0);
  return arr;
}

function move(dir) {
  if (over) return;
  const before = JSON.stringify(matrix);
  const prevState = makeState();

  if (dir === 'left' || dir === 'right') {
    for (let i = 0; i < SIZE; i++) {
      let row = matrix[i].slice();
      if (dir === 'right') row.reverse();
      let arr = slide(row);
      if (dir === 'right') arr.reverse();
      matrix[i] = arr;
    }
  } else {
    for (let j = 0; j < SIZE; j++) {
      let col = [];
      for (let i = 0; i < SIZE; i++) col.push(matrix[i][j]);
      if (dir === 'down') col.reverse();
      let arr = slide(col);
      if (dir === 'down') arr.reverse();
      for (let i = 0; i < SIZE; i++) matrix[i][j] = arr[i];
    }
  }

  const moved = before !== JSON.stringify(matrix);
  if (!moved) return;

  history.push(prevState);
  savedSinceLastMove = false;
  createNum();
  render();

  const nowMax = currentMax();
  if (nowMax > maxEver) {
    maxEver = nowMax;
    writeSave(makeState());
  }

  if (won) { stopAuto(); showOverlay('前面的区域以后再来探索吧'); }
  else if (isGameOver()) { over = true; stopAuto(); showOverlay('游戏结束'); }
}

function isGameOver() {
  if (getEmpty().length) return false;
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE; j++) {
      if (j < SIZE-1 && matrix[i][j] === matrix[i][j+1]) return false;
      if (i < SIZE-1 && matrix[i][j] === matrix[i+1][j]) return false;
    }
  return true;
}

function undo() {
  if (!history.length) return;
  stopAuto();                 
  const prev = history.pop();
  matrix = prev.matrix.map(r => r.slice());
  score = prev.score;
  maxEver = prev.maxEver;
  over = false; won = false;
  savedSinceLastMove = false;
  overlay.classList.remove('show');
  render();
}

function toggleAuto() {
  if (autoTimer) { stopAuto(); return; }
  if (over) return;
  autoBtn.classList.add('active');
  autoBtn.textContent = '停止托管';
  autoTimer = setInterval(() => {
    if (over || getEmpty().length === 0) { stopAuto(); return; }
    const dirs = ['up', 'down', 'left', 'right'];
    move(dirs[Math.floor(Math.random() * dirs.length)]);
    if (over || getEmpty().length === 0) stopAuto();
  }, 220);
}
function stopAuto() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  autoBtn.classList.remove('active');
  autoBtn.textContent = '智能托管';
}

function smartRearrange() {
  stopAuto();
  const vals = [];
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE; j++)
      if (matrix[i][j]) vals.push(matrix[i][j]);
  if (!vals.length) return;
  vals.sort((a, b) => b - a);  

  const order = [
    [3,3],[3,2],[3,1],[3,0],
    [2,0],[2,1],[2,2],[2,3],
    [1,3],[1,2],[1,1],[1,0],
    [0,0],[0,1],[0,2],[0,3]
  ];

  history.push(makeState());
  const nm = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  for (let k = 0; k < vals.length; k++) {
    const [x, y] = order[k];
    nm[x][y] = vals[k];
  }
  matrix = nm;
  savedSinceLastMove = false;
  render();
}

function render() {
  tilesEl.innerHTML = '';
  for (let i = 0; i < SIZE; i++) {
    for (let j = 0; j < SIZE; j++) {
      const v = matrix[i][j];
      const t = document.createElement('div');
      t.className = 'tile' + (v ? ' pop' : '');
      t.style.background = colors[v] || '#3c3a32';

      if (v) {
        const src = IMAGES[v];
        if (src) {
          const img = document.createElement('img');
          img.src = src;
          img.alt = v;
          img.onerror = () => {
            if (img.parentNode === t) t.removeChild(img);
            t.style.color = v > 4 ? '#f9f6f2' : (textColors[v] || '#776e65');
            t.textContent = v;
            t.style.fontSize = fontSizeFor(v);
          };
          t.appendChild(img);
        } else {
          t.style.color = v > 4 ? '#f9f6f2' : (textColors[v] || '#776e65');
          t.textContent = v;
          t.style.fontSize = fontSizeFor(v);
        }
      }
      tilesEl.appendChild(t);
    }
  }
  updateButtons();
}

function fontSizeFor(v) {
  if (v < 100) return '10vw';
  if (v < 1000) return '8vw';
  if (v < 10000) return '6vw';
  if (v < 100000) return '4.5vw';
  return '3.3vw';
}

function updateButtons() {
  undoBtn.disabled = history.length === 0;
  loadSaveBtn.disabled = !hasSave();
  saveBtn.disabled = savedSinceLastMove;
}

function showOverlay(text) {
  msgEl.textContent = text;
  updateButtons();
  overlay.classList.add('show');
}

// ---------- 事件 ----------
document.addEventListener('keydown', e => {
  const map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right'};
  if (map[e.key]) { e.preventDefault(); stopAuto(); move(map[e.key]); }
  if (e.key === 'Escape') initGame();
});

let sx = 0, sy = 0;
const board = document.getElementById('board');
board.addEventListener('touchstart', e => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive: true});
board.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (Math.max(ax, ay) < 20) return;
  stopAuto();
  if (ax > ay) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
}, {passive: true});

document.getElementById('undo').addEventListener('click', undo);
document.getElementById('save').addEventListener('click', () => writeSave(makeState()));
document.getElementById('restart').addEventListener('click', initGame);
document.getElementById('again').addEventListener('click', initGame);
document.getElementById('loadSave').addEventListener('click', () => {
  const s = readSave();
  if (s) applyState(s);
});
document.getElementById('auto').addEventListener('click', toggleAuto);        
document.getElementById('rearrange').addEventListener('click', smartRearrange); 

initGame();
</script>
</body>
</html>
