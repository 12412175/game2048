<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    background: #faf8ef;
    font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    overscroll-behavior: none;
    touch-action: none;
  }
  .controls {
    display: flex; gap: 10px; justify-content: center;
    padding: 16px; flex-wrap: wrap; width: 100%;
  }
  .controls button {
    background: #8f7a66; color: #f9f6f2; border: none; border-radius: 6px;
    padding: 10px 18px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .controls button:disabled { opacity: 0.4; cursor: default; }
  .controls button.active { background: #f65e3b; }

  .board {
    position: relative;
    background: #bbada0;
    padding: 2.5vw;
    width: 100vw;
    height: 100vw;
    max-width: 600px;
    max-height: 600px;
    margin: 0 auto;
  }
  .grid, .tiles {
    position: absolute;
    top: 2.5vw; left: 2.5vw; right: 2.5vw; bottom: 2.5vw;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 2.5vw;
  }
  .cell {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 6px;
  }
  .tiles { pointer-events: none; }
  .tile {
    position: relative;
    display: flex; justify-content: center; align-items: center;
    border-radius: 6px;
    font-weight: 800;
    color: #776e65;
    transition: transform 0.1s ease;
    overflow: hidden;
  }
  .tile.pop { animation: pop 0.15s ease; }
  @keyframes pop { 0%{transform:scale(0.5);} 100%{transform:scale(1);} }
  .tile img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 6px;
    display: block;
  }

  .overlay {
    position: absolute; inset: 0;
    display: none;
    justify-content: center; align-items: center;
    flex-direction: column;
    background: rgba(238, 228, 218, 0.8);
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay .msg { font-size: 40px; font-weight: 800; color: #776e65; margin-bottom: 20px; }
  .overlay .btns { display: flex; gap: 12px; }
  .overlay button {
    background: #8f7a66; color: #f9f6f2; border: none; border-radius: 6px;
    padding: 12px 22px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .overlay button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
  <div class="controls">
    <button id="loadTop">读取存档</button>  
    <button id="restart">重新开始</button>
    <button id="save">存档</button>
    <button id="undo">撤销</button>
  </div>

  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <div class="msg" id="msg">游戏结束</div>
      <div class="btns">
        <button id="again">再来一局</button>
        <button id="loadSave">读取存档</button>
      </div>
    </div>
  </div>

  <div class="controls">
   <select id="difficulty">
      <option value="512">辅助</option>
      <option value="8192" selected>专家</option>
      <option value="nightmare">梦魇</option>
    </select>
    <button id="auto">智能托管</button>
    <button id="rearrange">智能重排</button>
  </div>

<script>
const SIZE = 4;
const WIN_VALUE = 134217728;  
let matrix = [];
let score = 0;
let over = false;
let won = false;
let maxEver = 0;
let history = [];
let savedState = null;
let savedSinceLastMove = false;
let autoTimer = null;
let autoPhase = 'random';      
let difficultyBase = 8192;

const SAVE_KEY = 'game2048_save';

const colors = {
  0:'#cdc1b4',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',
  32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',
  1024:'#edc53f',2048:'#edc22e',
  4096:'#3c3a32',8192:'#a333c8',16384:'#8e24aa',32768:'#5e35b1',
  65536:'#3949ab',131072:'#1e88e5',262144:'#039be5',524288:'#00acc1',
  1048576:'#00897b',2097152:'#43a047',4194304:'#7cb342',8388608:'#c0ca33',
  16777216:'#fdd835',33554432:'#ffb300',67108864:'#fb8c00',134217728:'#f4511e'
};
const textColors = {2:'#776e65',4:'#776e65'};

const IMG_BASE = 'https://raw.githubusercontent.com/12412175/game2048/main/images/';
const IMAGES = {};
for (let p = 1; p <= 27; p++) {        // 2^1=2 ... 2^27=134217728
  const v = Math.pow(2, p);
  IMAGES[v] = IMG_BASE + v + '.png';
}

const gridEl = document.getElementById('grid');
const tilesEl = document.getElementById('tiles');
const overlay = document.getElementById('overlay');
const msgEl = document.getElementById('msg');
const undoBtn = document.getElementById('undo');
const saveBtn = document.getElementById('save');
const loadSaveBtn = document.getElementById('loadSave');
const loadTopBtn = document.getElementById('loadTop');   
const autoBtn = document.getElementById('auto');

for (let i = 0; i < SIZE*SIZE; i++) {
  const c = document.createElement('div');
  c.className = 'cell';
  gridEl.appendChild(c);
}

// ---------- 存档读写 ----------
function writeSave(state) {
  savedState = state;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
  savedSinceLastMove = true;
  updateButtons();
}
function readSave() {
  if (savedState) return savedState;
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (s) { savedState = JSON.parse(s); return savedState; }
  } catch(e) {}
  return null;
}
function hasSave() { return !!readSave(); }

function makeState() {
  return {
    matrix: matrix.map(r => r.slice()),
    score: score,
    maxEver: maxEver
  };
}
function applyState(state) {
  matrix = state.matrix.map(r => r.slice());
  score = state.score;
  maxEver = state.maxEver;
  over = false; won = false;
  history = [];
  savedSinceLastMove = true;
  overlay.classList.remove('show');
  render();
}

// ---------- 游戏逻辑 ----------
function initGame() {
  stopAuto();
  matrix = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  score = 0; over = false; won = false; maxEver = 0;
  history = [];
  savedSinceLastMove = false;
  overlay.classList.remove('show');
  createNum(); createNum();
  render();
}

function getEmpty() {
  const list = [];
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE; j++)
      if (matrix[i][j] === 0) list.push([i, j]);
  return list;
}

function currentMax() {
  let m = 0;
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE; j++)
      if (matrix[i][j] > m) m = matrix[i][j];
  return m;
}

function hasTileLE(val) {
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE; j++)
      if (matrix[i][j] !== 0 && matrix[i][j] <= val) return true;
  return false;
}

// 由难度控制的最小出生值
function newTileMin() {
  if (difficultyBase === Infinity) return 2;   // 梦魇：不停
  const m = currentMax();
  let minVal = 2;
  for (let n = 1; ; n++) {
    const threshold = difficultyBase * Math.pow(2, n - 1);
    const lowLimit  = Math.pow(2, n);
    if (m >= threshold && !hasTileLE(lowLimit)) {
      minVal = Math.pow(2, n + 1);
    } else {
      break;
    }
  }
  return minVal;
}

function isAdjacentToTile(x, y) {
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for (const [dx, dy] of dirs) {
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && matrix[nx][ny] !== 0)
      return true;
  }
  return false;
}

function createNum() {
  const empty = getEmpty();
  if (!empty.length) return;
  let candidates = empty.filter(([x, y]) => !isAdjacentToTile(x, y));
  if (!candidates.length) candidates = empty;
  const [x, y] = candidates[Math.floor(Math.random() * candidates.length)];
  const minVal = newTileMin();
  // 90% 出最小值，10% 出次小值
  matrix[x][y] = Math.random() < 0.9 ? minVal : minVal * 2;
}

function slide(line) {
  let arr = line.filter(v => v !== 0);
  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i] === arr[i+1]) {
      arr[i] *= 2;
      score += arr[i];
      if (arr[i] === WIN_VALUE) won = true;
      arr.splice(i+1, 1);
    }
  }
  while (arr.length < SIZE) arr.push(0);
  return arr;
}

function move(dir) {
  if (over) return;
  const before = JSON.stringify(matrix);
  const prevState = makeState();

  if (dir === 'left' || dir === 'right') {
    for (let i = 0; i < SIZE; i++) {
      let row = matrix[i].slice();
      if (dir === 'right') row.reverse();
      let arr = slide(row);
      if (dir === 'right') arr.reverse();
      matrix[i] = arr;
    }
  } else {
    for (let j = 0; j < SIZE; j++) {
      let col = [];
      for (let i = 0; i < SIZE; i++) col.push(matrix[i][j]);
      if (dir === 'down') col.reverse();
      let arr = slide(col);
      if (dir === 'down') arr.reverse();
      for (let i = 0; i < SIZE; i++) matrix[i][j] = arr[i];
    }
  }

  const moved = before !== JSON.stringify(matrix);
  if (!moved) return;

  history.push(prevState);
  savedSinceLastMove = false;
  createNum();
  render();

  const nowMax = currentMax();
  if (nowMax > maxEver) {
    maxEver = nowMax;
    writeSave(makeState());
  }

  if (won) { stopAuto(); showOverlay('已经到顶啦♥'); }
  else if (isGameOver()) { over = true; stopAuto(); showOverlay('杂口♥ 杂口♥'); }
}

function isGameOver() {
  if (getEmpty().length) return false;
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE; j++) {
      if (j < SIZE-1 && matrix[i][j] === matrix[i][j+1]) return false;
      if (i < SIZE-1 && matrix[i][j] === matrix[i+1][j]) return false;
    }
  return true;
}

function undo() {
  if (!history.length) return;
  stopAuto();
  const prev = history.pop();
  matrix = prev.matrix.map(r => r.slice());
  score = prev.score;
  maxEver = prev.maxEver;
  over = false; won = false;
  savedSinceLastMove = false;
  overlay.classList.remove('show');
  render();
}

function toggleAuto() {
  if (autoTimer) { stopAuto(); return; }
  if (over) return;
  autoPhase = 'random';
  autoBtn.classList.add('active');
  autoBtn.textContent = '停止托管';
  autoTimer = setInterval(autoStep, 220);
}
function stopAuto() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  autoPhase = 'random';
  autoBtn.classList.remove('active');
  autoBtn.textContent = '智能托管';
}

// 随机选一个能真正产生移动的方向执行
function tryRandomMove() {
  const dirs = ['up', 'down', 'left', 'right'];
  for (let i = dirs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
  }
  const before = JSON.stringify(matrix);
  for (const d of dirs) {
    move(d);
    if (JSON.stringify(matrix) !== before) return true;
  }
  return false;
}

function autoStep() {
  if (over || !autoTimer) { stopAuto(); return; }
  const empty = getEmpty().length;

  if (autoPhase === 'random') {
    if (empty <= 1) { autoPhase = 'rearrange'; return; }   // 只剩1个空格，进入重排
    const moved = tryRandomMove();
    if (!moved) autoPhase = 'rearrange';                   // 无可动方向，也去重排
  } else if (autoPhase === 'rearrange') {
    smartRearrange();
    autoPhase = 'left';
  } else if (autoPhase === 'left') {
    move('left');
    autoPhase = 'right';
  } else if (autoPhase === 'right') {
    move('right');
    autoPhase = 'random';                                  // 回到随机滑动
  }
}

// 智能重排：蛇形从大到小排列
function smartRearrange() {
  const vals = [];
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE; j++)
      if (matrix[i][j]) vals.push(matrix[i][j]);
  if (!vals.length) return;
  vals.sort((a, b) => b - a);

  const order = [
    [3,3],[3,2],[3,1],[3,0],
    [2,0],[2,1],[2,2],[2,3],
    [1,3],[1,2],[1,1],[1,0],
    [0,0],[0,1],[0,2],[0,3]
  ];

  history.push(makeState());
  const nm = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  for (let k = 0; k < vals.length; k++) {
    const [x, y] = order[k];
    nm[x][y] = vals[k];
  }
  matrix = nm;
  savedSinceLastMove = false;
  render();
}

function render() {
  tilesEl.innerHTML = '';
  for (let i = 0; i < SIZE; i++) {
    for (let j = 0; j < SIZE; j++) {
      const v = matrix[i][j];
      const t = document.createElement('div');
      t.className = 'tile' + (v ? ' pop' : '');
      t.style.background = colors[v] || '#3c3a32';

      if (v) {
        const src = IMAGES[v];
        if (src) {
          const img = document.createElement('img');
          img.src = src;
          img.alt = v;
          img.onerror = () => {
            if (img.parentNode === t) t.removeChild(img);
            t.style.color = v > 4 ? '#f9f6f2' : (textColors[v] || '#776e65');
            t.textContent = v;
            t.style.fontSize = fontSizeFor(v);
          };
          t.appendChild(img);
        } else {
          t.style.color = v > 4 ? '#f9f6f2' : (textColors[v] || '#776e65');
          t.textContent = v;
          t.style.fontSize = fontSizeFor(v);
        }
      }
      tilesEl.appendChild(t);
    }
  }
  updateButtons();
}

function fontSizeFor(v) {
  if (v < 100) return '10vw';
  if (v < 1000) return '8vw';
  if (v < 10000) return '6vw';
  if (v < 100000) return '4.5vw';
  if (v < 10000000) return '3.3vw';
  return '2.4vw';
}

function updateButtons() {
  undoBtn.disabled = history.length === 0;
  loadSaveBtn.disabled = !hasSave();
  loadTopBtn.disabled = !hasSave();      
  saveBtn.disabled = savedSinceLastMove;
}

function showOverlay(text) {
  msgEl.textContent = text;
  updateButtons();
  overlay.classList.add('show');
}

// ---------- 事件 ----------
document.addEventListener('keydown', e => {
  const map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right'};
  if (map[e.key]) { e.preventDefault(); stopAuto(); move(map[e.key]); }
  if (e.key === 'Escape') initGame();
});

let sx = 0, sy = 0;
const board = document.getElementById('board');
board.addEventListener('touchstart', e => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive: true});
board.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (Math.max(ax, ay) < 20) return;
  stopAuto();
  if (ax > ay) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
}, {passive: true});

document.getElementById('undo').addEventListener('click', undo);
document.getElementById('save').addEventListener('click', () => writeSave(makeState()));
document.getElementById('restart').addEventListener('click', initGame);
document.getElementById('again').addEventListener('click', initGame);
document.getElementById('loadSave').addEventListener('click', () => {
  const s = readSave();
  if (s) applyState(s);
});
document.getElementById('loadTop').addEventListener('click', () => {  
  const s = readSave();
  if (s) applyState(s);
});
document.getElementById('auto').addEventListener('click', toggleAuto);
document.getElementById('rearrange').addEventListener('click', smartRearrange);
 
difficultyEl.addEventListener('change', () => {
  const v = difficultyEl.value;
  difficultyBase = (v === 'nightmare') ? Infinity : parseInt(v, 10);
});
 
initGame();
</script>
</body>
</html>
